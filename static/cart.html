<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | ALDI E-Commerce</title>

    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/cart.css">
</head>

<body>

<div id="site-header"></div>

    <main class="cart-page">

        <div class="cart-header">
            <h1>Shopping Cart</h1>
            <p>Review your selected products before checkout.</p>
        </div>

        <section
            id="cart-items"
            class="cart-items"
        ></section>

        <div
            id="empty-cart"
            class="empty-cart hidden"
        >
            <p>Your cart is empty.</p>
            <a class="empty-cart__link" href="/products">Browse products</a>
        </div>

        <section class="cart-summary" id="cart-summary">

            <div class="summary-line">
                <span>Items</span>
                <span id="cart-count">0</span>
            </div>

            <div class="summary-row">
                <span>Total</span>
                <strong id="cart-total">€0.00</strong>
            </div>

            <button
                id="checkout-button"
                class="checkout-button"
            >
                Proceed to Checkout
            </button>

            <p class="summary-note" id="login-hint" hidden>You will be asked to log in before checkout.</p>
            <p class="summary-note">Demo store: no payment is taken.</p>
            <a class="continue-link" href="/products">← Continue shopping</a>

        </section>

    </main>

    <div id="site-footer"></div>

<script src="/js/site.js"></script>
<script src="/js/cart.js"></script>

</body>

</html>
